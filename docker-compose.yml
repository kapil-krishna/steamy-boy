services:
  db:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: steamy_boy
      POSTGRES_USER: steamy_boy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-steamy_boy}
    ports:
      # Bound to localhost only. Change POSTGRES_PORT in .env if 5432 is taken.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steamy_boy -d steamy_boy"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
